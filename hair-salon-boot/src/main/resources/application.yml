server:
  port: 8080
#  servlet:
#    context-path: /salon

spring:
  application:
    name: hair-salon
    description: hair-salon管理系统
  profiles:
    active: company
  servlet:
    multipart:
      # 单文件上限与 common-minio maxSize（默认 10MB）对齐，避免 Spring 默认 1MB 先拦截
      max-file-size: 10MB
      max-request-size: 50MB
  sql:
    init:
      # 首次启动建表；表已存在后可改为 never
      mode: never
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.wangjin.salon.system.handler
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id

wj:
  security:
    jwt:
      secret: hair-salon-dev-secret-key-32bytes!!
      expire-seconds: 86400
      ignore-urls:
        - /auth/login
        - /doc.html
        - /webjars/**
        - /v3/api-docs/**
        - /swagger-ui/**
        - /swagger-resources/**
        - /favicon.ico
        - /error
  mybatis:
    db-type: postgresql
    tenant-enabled: true
    tenant-column: tenant_id
    data-permission-enabled: true
    ignore-tables:
      - sys_tenant
      - sys_user_role
      - sys_role_menu
      # 菜单全局共享：各租户角色通过 sys_role_menu 挂同一套菜单
      - sys_menu
  apidoc:
    title: 理发店管理系统 API
    version: 1.0.0
  # MinIO（common-minio）；本地 Docker 见 ../wj-framework/docs/minio-deploy.md
  minio:
    enabled: true
    endpoint: http://127.0.0.1:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: hair-salon
    public-url: http://127.0.0.1:9000
    create-bucket-if-missing: true
    public-read: false
    # 预签名 URL 默认有效期（秒），与 JWT expire-seconds 对齐：会话内有效，登录失效即失效
    default-expiry-seconds: 86400
    tenant-path: true
    # 业务侧 SysFileController 已提供上传；框架内置 HTTP 关闭，避免双路径
    endpoint-enabled: false
  # 后台建人/开通租户初始密码与密码策略；生产请覆盖
  salon:
    default-password: admin123
    # 密码过期天数：<=0 不启用过期强制改密（仍保留逻辑）；>0 时距上次改密超过该天数须重置
    # 无论是否启用过期，last_password_change_time IS NULL（首次/管理员重置后）仍强制改密
    password-expire-days: 0

logging:
  level:
    com.wangjin: debug
    org.springframework.data.redis: info
